<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<style>
  :root{
    --char-950:#171310; --char-900:#221b16; --char-700:#3a2c22;
    --flame-600:#d9391f; --flame-500:#e8792b; --ember-400:#f2a53a; --gold-200:#f6d98a;
    --paper:#fbf4ea; --paper-dim:#f3e6d5;
    --ink-900:#241c15; --ink-600:#6b5945; --ink-400:#8f7c68;
    --status-green:#3f9868; --red-500:#c92f1c;
    --font-display:'Bricolage Grotesque','Sora',system-ui,sans-serif;
    --font-body:'IBM Plex Sans',system-ui,sans-serif;
    --font-mono:'IBM Plex Mono','SFMono-Regular',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--char-950);color:var(--paper);font-family:var(--font-body);-webkit-tap-highlight-color:transparent;}
  #app{height:100%;display:flex;flex-direction:column;}
  @supports (height: 100dvh) {
    #app{height:100dvh;}
  }
  button{font-family:inherit;cursor:pointer;}
  input,textarea{font-family:inherit;}
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
    padding:12px 14px;background:linear-gradient(180deg,var(--char-900),var(--char-950));
    border-bottom:1px solid var(--char-700);}
  .topbar__brand{font-family:var(--font-display);font-weight:700;font-size:17px;
    background:linear-gradient(90deg,var(--flame-600),var(--ember-400));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .topbar__spacer{flex:1;}
  .topbar__back{background:none;border:1px solid var(--char-700);color:var(--paper);
    border-radius:10px;padding:6px 10px;font-size:14px;}
  .topbar__mesero{font-size:12px;color:var(--ink-400);font-family:var(--font-mono);}
  .topbar__logout{background:none;border:1px solid var(--char-700);color:var(--ink-400);
    border-radius:10px;width:32px;height:32px;font-size:15px;line-height:1;margin-left:8px;}
  .cart-icon-btn{position:relative;background:var(--char-900);border:1px solid var(--char-700);
    color:var(--paper);border-radius:10px;padding:6px 10px;font-size:16px;line-height:1;}
  .cart-icon-badge{position:absolute;top:-6px;right:-6px;background:var(--flame-600);color:#fff;
    font-size:11px;font-weight:700;border-radius:999px;min-width:18px;height:18px;
    display:flex;align-items:center;justify-content:center;padding:0 4px;}
  .menu-section{margin-bottom:22px;scroll-margin-top:180px;}
  .menu-section__title{font-family:var(--font-display);font-size:15px;font-weight:700;
    color:var(--ember-400);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--char-700);}
  .menu-subcategory{font-family:var(--font-display);font-size:12.5px;font-weight:700;
    color:var(--ember-400);margin:14px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--char-700);}
  .menu-subcategory:first-child{margin-top:0;}
  .login{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;text-align:center;gap:16px;}
  .login__logo{font-family:var(--font-display);font-size:30px;font-weight:800;
    background:linear-gradient(90deg,var(--flame-600),var(--ember-400),var(--gold-200));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .login__sub{color:var(--ink-400);font-size:14px;margin-top:-8px;}
  .login input{width:100%;max-width:320px;padding:14px 16px;border-radius:12px;
    border:1px solid var(--char-700);background:var(--char-900);color:var(--paper);font-size:16px;}
  .login button{width:100%;max-width:320px;padding:14px;border-radius:12px;border:none;
    background:linear-gradient(90deg,var(--flame-600),var(--flame-500));color:#fff;
    font-weight:700;font-size:15px;}
  .login button:disabled{opacity:.4;}
  .screen{flex:1;padding:14px;overflow-y:auto;padding-bottom:90px;}
  .menu-sticky-head{position:sticky;top:0;z-index:15;background:var(--char-950);
    margin:-14px -14px 0;padding:14px 14px 2px;}
  .section-title{font-family:var(--font-display);font-size:13px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--ink-400);margin:18px 0 10px;}
  .section-title:first-child{margin-top:0;}
  .empty-hint{color:var(--ink-400);font-size:13px;padding:20px 4px;}
  .fp-legend{display:flex;gap:16px;align-items:center;font-size:12px;color:var(--ink-400);margin:0 0 12px;}
  .fp-legend span{display:flex;align-items:center;gap:6px;}
  .fp-legend i{width:12px;height:12px;border-radius:4px;display:inline-block;}
  .fp-legend i.free{background:linear-gradient(160deg,#2c4a3a,#1f3428);border:1px solid #3f9868;}
  .fp-legend i.busy{background:linear-gradient(160deg,var(--flame-600),#a12314);border:1px solid var(--flame-500);}
  .floor-plan-wrap{overflow:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--char-700);
    border-radius:14px;background:var(--char-900);padding:14px;}
  .floor-plan{display:flex;flex-direction:column;gap:18px;}
  .fp-row{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start;}
  .fp-row--inner{gap:22px;flex:1;}
  .fp-cluster{display:flex;flex-wrap:wrap;gap:8px;}
  .fp-cluster--col{flex-direction:column;}
  .fp-cluster--right{margin-left:auto;}
  .fp-item{width:56px;aspect-ratio:1/1;flex:0 0 auto;border-radius:10px;border:1px solid #3f9868;
    background:linear-gradient(160deg,#2c4a3a,#1f3428);color:var(--paper);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    font-weight:700;font-family:var(--font-body);font-size:13px;line-height:1.15;
    text-align:center;padding:4px;word-break:break-word;}
  .fp-item.busy{background:linear-gradient(160deg,var(--flame-600),#a12314);border-color:var(--flame-500);}
  .fp-item--1to19{border:2px solid #FFD700;background:linear-gradient(160deg,#FFF8DC,#FFE74C);color:#333;}
  .fp-item--1to19.busy{background:linear-gradient(160deg,#FF6B6B,#FF4444);border-color:#FF2222;color:white;}
  .fp-item--normal{border:2px solid #2E6F40;background:linear-gradient(160deg,#4A9D6F,#2E6F40);color:white;}
  .fp-item--normal.busy{background:linear-gradient(160deg,#FF8C42,#FF6B00);border-color:#FF4500;color:white;}
  .fp-item--llevar{border:2px solid #7C3AED;background:linear-gradient(160deg,#A78BFA,#7C3AED);color:white;}
  .fp-item--llevar.busy{background:linear-gradient(160deg,#EC4899,#DB2777);border-color:#BE185D;color:white;}
  .fp-item--express{border:2px solid #0000FF;background:linear-gradient(160deg,#4D4DFF,#0000CC);color:white;}
  .fp-item--express.busy{background:linear-gradient(160deg,#FF3333,#CC0000);border-color:#990000;color:white;}
  .fp-item small{font-family:var(--font-mono);font-weight:400;opacity:.85;font-size:9px;}
  .order-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;}
  .order-head h1{font-family:var(--font-display);font-size:20px;margin:0;}
  .order-head span{color:var(--ink-400);font-size:12px;font-family:var(--font-mono);}
  .cat-nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:12px;scrollbar-width:none;}
  .cat-nav::-webkit-scrollbar{display:none;}
  .cat-chip{flex:0 0 auto;padding:8px 14px;border-radius:999px;border:1px solid var(--char-700);
    background:var(--char-900);color:var(--paper-dim);font-size:13px;font-weight:600;white-space:nowrap;}
  .cat-chip.active{background:linear-gradient(90deg,var(--flame-600),var(--flame-500));
    border-color:transparent;color:#fff;}
  .item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
  .menu-search-wrap{position:relative;margin-bottom:12px;}
  .menu-search{width:100%;padding:12px 40px 12px 14px;border-radius:12px;
    border:1px solid var(--char-700);background:var(--char-900);color:var(--paper);font-size:15px;}
  .menu-search::placeholder{color:var(--ink-400);}
  .menu-search__clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);

  .item-card{text-align:left;border-radius:14px;border:1px solid var(--char-700);

    gap:6px;min-height:84px;position:relative;}

  .item-card.unavailable{opacity:.4;}
  .item-card__name{font-weight:700;font-size:14px;line-height:1.25;}
  .item-card__price{font-family:var(--font-mono);color:var(--ember-400);font-size:13px;}
  .item-card__badge{position:absolute;top:8px;right:8px;background:var(--flame-600);color:#fff;
    font-size:11px;font-weight:700;border-radius:999px;min-width:20px;height:20px;
    display:flex;align-items:center;justify-content:center;padding:0 5px;}
  .cart-bar{position:fixed;left:14px;right:14px;bottom:14px;z-index:30;
    background:linear-gradient(90deg,var(--flame-600),var(--flame-500));border-radius:16px;
    padding:14px 16px;display:flex;align-items:center;justify-content:space-between;
    box-shadow:0 8px 24px rgba(0,0,0,.4);color:#fff;font-weight:700;}
  .cart-bar span.count{background:rgba(255,255,255,.25);border-radius:999px;padding:2px 9px;font-size:12px;margin-right:8px;}
  .sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-end;}
  .sheet{width:100%;max-height:82vh;background:var(--char-900);border-radius:20px 20px 0 0;
    padding:16px 16px 20px;overflow-y:auto;border-top:1px solid var(--char-700);}
  .sheet__handle{width:40px;height:4px;background:var(--char-700);border-radius:99px;margin:0 auto 14px;}
  .sheet h2{font-family:var(--font-display);margin:0 0 12px;font-size:18px;}
  .cart-row{padding:9px 0;border-bottom:1px solid var(--char-700);}
  .cart-row__top{display:flex;align-items:center;gap:10px;}
  .cart-row__name{flex:1;font-size:14px;}
  .cart-row__name small{display:block;color:var(--ink-400);font-family:var(--font-mono);font-size:12px;}
  .qty-ctrl{display:flex;align-items:center;gap:8px;}
  .qty-ctrl button{width:28px;height:28px;border-radius:8px;border:1px solid var(--char-700);
    background:var(--char-950);color:var(--paper);font-size:16px;line-height:1;}
  .cart-row__sub{font-family:var(--font-mono);font-size:13px;min-width:64px;text-align:right;}
  .cart-row__note{width:100%;margin-top:7px;padding:8px 10px;border-radius:8px;
    border:1px solid var(--char-700);background:var(--char-950);color:var(--paper);font-size:12.5px;}
  .cart-row__note::placeholder{color:var(--ink-400);}
  .cart-total{display:flex;justify-content:space-between;padding:14px 0 6px;font-weight:700;font-size:17px;}
  .sheet textarea{width:100%;margin-top:8px;padding:10px;border-radius:10px;border:1px solid var(--char-700);
    background:var(--char-950);color:var(--paper);resize:vertical;font-size:13px;}
  .sheet-actions{display:flex;gap:10px;margin-top:14px;}
  .btn-primary{flex:1;padding:14px;border-radius:12px;border:none;
    background:linear-gradient(90deg,var(--flame-600),var(--flame-500));color:#fff;font-weight:700;font-size:14px;}
  .btn-secondary{flex:1;padding:14px;border-radius:12px;border:1px solid var(--char-700);
    background:var(--char-900);color:var(--paper);font-weight:700;font-size:14px;}
  .btn-ghost{flex:1;padding:14px;border-radius:12px;border:1px solid var(--char-700);
    background:none;color:var(--paper);font-weight:700;font-size:14px;}
  .btn-primary:disabled,.btn-secondary:disabled,.btn-ghost:disabled{opacity:.4;}
  .close-x{position:absolute;right:14px;top:14px;background:none;border:none;color:var(--ink-400);font-size:20px;}
  .pay-row{display:flex;gap:8px;margin:10px 0;}
  .pay-chip{flex:1;padding:10px;border-radius:10px;border:1px solid var(--char-700);
    background:var(--char-950);color:var(--paper);font-size:13px;font-weight:600;}
  .pay-chip.active{background:linear-gradient(90deg,var(--flame-600),var(--flame-500));border-color:transparent;}
  .split-toggle{display:flex;gap:8px;margin:4px 0 16px;background:var(--char-950);
    border:1px solid var(--char-700);border-radius:12px;padding:4px;}
  .split-toggle button{flex:1;padding:10px 6px;border-radius:9px;border:none;background:none;
    color:var(--ink-400);font-weight:700;font-size:12.5px;}
  .split-toggle button.active{background:linear-gradient(90deg,var(--flame-600),var(--flame-500));color:#fff;}
  .split-hint{color:var(--ink-400);font-size:12.5px;margin-bottom:10px;line-height:1.4;}
  .split-warning{color:var(--ember-400);font-size:12.5px;font-weight:600;margin:2px 0 10px;display:flex;align-items:center;gap:6px;}
  .split-personas{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .persona-chip{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;
    padding:8px 10px;border-radius:12px;border:2px solid var(--char-700);background:var(--char-950);
    color:var(--paper);min-width:84px;}
  .persona-chip .p-name{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;}
  .persona-chip .p-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
  .persona-chip .p-total{font-family:var(--font-mono);font-size:12px;color:var(--ink-400);}
  .persona-chip.active{border-color:var(--flame-500);background:var(--char-900);}
  .persona-chip__remove{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;
    background:var(--char-700);color:var(--paper);border:1px solid var(--char-950);font-size:12px;
    display:flex;align-items:center;justify-content:center;padding:0;}
  .persona-add{padding:8px 12px;border-radius:12px;border:1px dashed var(--char-700);
    background:none;color:var(--ink-400);font-size:12.5px;font-weight:700;min-width:84px;}
  .split-item{padding:10px 0;border-bottom:1px solid var(--char-700);}
  .split-item__head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .split-item__head .name{font-size:13.5px;font-weight:600;}
  .split-item__head .price{font-family:var(--font-mono);color:var(--ink-400);font-size:12px;}
  .unit-chips{display:flex;gap:7px;flex-wrap:wrap;}
  .unit-chip{width:34px;height:34px;border-radius:9px;border:1px solid var(--char-700);
    background:var(--char-950);color:var(--ink-400);font-family:var(--font-mono);font-weight:700;font-size:12px;
    display:flex;align-items:center;justify-content:center;}
  .unit-chip.assigned{color:#fff;border-color:transparent;}
  .split-summary{margin-top:16px;padding-top:4px;}
  .persona-pay{margin-bottom:14px;}
  .persona-pay__row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .persona-pay__name{font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px;}
  .persona-pay__total{font-family:var(--font-mono);font-size:13px;}
  .persona-pay .pay-row{margin:0 0 4px;}
  .persona-pay .pay-chip{font-size:11.5px;padding:7px;}
  .toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--status-green);
    color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:60;}
  .loading{flex:1;display:flex;align-items:center;justify-content:center;color:var(--ink-400);}
  #offline-banner{display:none;position:fixed;top:0;left:0;right:0;z-index:3000;
    background:#b45309;color:#fff;text-align:center;font-size:12.5px;font-weight:700;
    padding:9px 14px;box-shadow:0 2px 10px rgba(0,0,0,.25);}
  #offline-banner.show{display:block;}
  #offline-banner.show ~ #app{padding-top:38px;}
  #install-banner{display:none;position:fixed;top:0;left:0;right:0;z-index:2900;
    background:var(--char-950);color:var(--paper);font-size:12.5px;padding:9px 12px;
    box-shadow:0 2px 10px rgba(0,0,0,.25);align-items:center;gap:8px;}
  #install-banner.show{display:flex;}
  #install-banner.show ~ #app{padding-top:40px;}
  #install-banner span{flex:1;line-height:1.4;}
  #install-banner button{border:none;border-radius:999px;font-weight:700;cursor:pointer;}
  #install-banner .install-btn{background:linear-gradient(90deg,var(--flame-600),var(--flame-500));
    color:#fff;padding:6px 12px;font-size:12px;white-space:nowrap;}
  #install-banner .close-btn{background:none;color:var(--paper-dim);font-size:14px;padding:4px;flex:0 0 auto;}
  
  .baldazo-modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;}
  .baldazo-modal__content{background:var(--char-900);border-radius:16px;max-width:100%;max-height:90vh;overflow-y:auto;padding:20px;width:100%;border:1px solid var(--char-700);}
  .baldazo-modal__header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .baldazo-modal__title{font-family:var(--font-display);font-size:18px;font-weight:700;margin:0;}
  .baldazo-modal__close{background:none;border:none;color:var(--ink-400);font-size:24px;cursor:pointer;padding:0;width:24px;height:24px;}
  .baldazo-section{margin-bottom:20px;}
  .baldazo-section__title{font-family:var(--font-display);font-size:14px;font-weight:700;color:var(--ember-400);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--char-700);}
  .baldazo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;}
  .baldazo-beer{border:2px solid var(--char-700);border-radius:10px;padding:10px;text-align:center;background:var(--char-950);transition:all 0.2s;cursor:pointer;}
  .baldazo-beer:active{transform:scale(.95);}
  .baldazo-beer.selected{border-color:var(--flame-600);background:linear-gradient(160deg,rgba(217,57,31,.2),rgba(232,121,43,.1));}
  .baldazo-beer__name{font-size:13px;font-weight:700;color:var(--paper);display:block;margin-bottom:4px;}
  .baldazo-beer__price{font-family:var(--font-mono);font-size:11px;color:var(--ink-400);display:block;}
  .baldazo-beer__check{display:inline-block;width:16px;height:16px;border:1px solid var(--char-700);border-radius:3px;margin-top:6px;background:var(--char-900);}
  .baldazo-beer.selected .baldazo-beer__check{background:var(--flame-600);border-color:var(--flame-600);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;}
  .baldazo-counter{text-align:center;font-family:var(--font-display);font-size:16px;font-weight:700;color:var(--ember-400);margin:20px 0;padding:12px;background:var(--char-950);border-radius:10px;border:1px solid var(--char-700);}
  .baldazo-actions{display:flex;gap:10px;margin-top:20px;}
</style>
</head>
<body>
<div id="offline-banner">📡 Sin conexión — los cambios se guardan en el celular y se envían solos cuando vuelva la señal</div>
<div id="install-banner"></div>
<div id="app"><div class="loading">Cargando…</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
  collection, doc, setDoc, deleteDoc, onSnapshot, updateDoc, serverTimestamp, query, where, runTransaction, getDoc
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: 'AIzaSyBLVHsF0VqPorPkK0auaWUH_4-k-loC6iU',
  authDomain: 'acosta-food.firebaseapp.com',
  projectId: 'acosta-food',
  storageBucket: 'acosta-food.firebasestorage.app',
  messagingSenderId: '605529235094',
  appId: '1:605529235094:web:035dff54f04af00654acb7',
  measurementId: 'G-QWEN1MWXXZ',
};
const app = initializeApp(firebaseConfig);
const db = initializeFirestore(app, {localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })}, 'default');

async function writeAndContinue(promise) {
  if (navigator.onLine) { await promise; return { queued: false }; }
  promise.catch(() => {}); return { queued: true };
}

function updateOnlineBanner() {
  const banner = document.getElementById('offline-banner');
  if (!banner) return; banner.classList.toggle('show', !navigator.onLine);
}
window.addEventListener('online', updateOnlineBanner);
window.addEventListener('offline', updateOnlineBanner);

(function () {
  const yaInstalada = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if (yaInstalada || localStorage.getItem('pirchas-install-dismissed') === '1') return;

function disponibilidadPorHorario(categoria) {
  const cat = normalizeCategory(categoria);
  const now = new Date(); const dia = now.getDay(); const minutos = now.getHours() * 60 + now.getMinutes();
  if (cat.includes('ejecutivo')) {
    const enHorario = dia >= 1 && dia <= 5 && minutos >= 11 * 60 && minutos < 16 * 60;
    return { disponible: enHorario, mensaje: 'Disponible lunes a viernes, 11 a.m. a 4 p.m.' };
  }
  if (cat.includes('bocas')) {
    const enHorario = dia >= 1 && dia <= 4 && minutos >= 17 * 60 && minutos < 22 * 60;
    return { disponible: enHorario, mensaje: 'Disponible lunes a jueves, 5 p.m. a 10 p.m.' };
  }
  return { disponible: true, mensaje: null };
}

const CATEGORY_ORDER = ['Menú infantil','Especialidades Mexicanas','Bebidas','Batidos en agua','Batidos en leche','Bebidas calientes','Otras Especialidades','Para Compartir','Entradas calientes','Arroces','Pastas','Casados con','Cortes especiales','Hamburguesas','Plato Ejecutivo','Noche de Bocas'];
const SUBCATEGORY_ORDER = { 'bebidas calientes': ['Café', 'Té', 'Aguadulce', 'Chocolate'] };

function sortCategories(categories, customOrder) {
  const base = customOrder && customOrder.length > 0 ? customOrder : CATEGORY_ORDER;
  const priority = base.map(normalizeText);
  return [...categories].sort((a, b) => {
    const ia = priority.indexOf(normalizeText(a)); const ib = priority.indexOf(normalizeText(b));
    if (ia === -1 && ib === -1) return 0; if (ia === -1) return 1; if (ib === -1) return -1; return ia - ib;
  });
}

function groupBySubcategoria(categoria, platos) {
  const tieneSubcategorias = platos.some((p) => p.subcategoria);
  if (!tieneSubcategorias) return [{ subcategoria: null, platos }];
  const orden = SUBCATEGORY_ORDER[normalizeText(categoria)] || [];
  const ordenNormalizado = orden.map(normalizeText);
  const grupos = new Map();
  platos.forEach((p) => { const key = p.subcategoria || ''; if (!grupos.has(key)) grupos.set(key, []); grupos.get(key).push(p); });
  const entries = [...grupos.entries()];
  entries.sort(([a], [b]) => {
    if (a === '' && b === '') return 0; if (a === '') return -1; if (b === '') return 1;
    const ia = ordenNormalizado.indexOf(normalizeText(a)); const ib = ordenNormalizado.indexOf(normalizeText(b));
    if (ia === -1 && ib === -1) return a.localeCompare(b); if (ia === -1) return 1; if (ib === -1) return -1; return ia - ib;
  });
  return entries.map(([subcategoria, items]) => ({ subcategoria: subcategoria || null, platos: items }));
}

function sincronizarRondas(rondasPrevias, draftItems) {
  const rondas = rondasPrevias.map((r) => ({ ...r, items: r.items.map((i) => ({ ...i })) }));
  const totalEnRondas = new Map();
  rondas.forEach((r) => r.items.forEach((i) => { totalEnRondas.set(i.nombre, (totalEnRondas.get(i.nombre) || 0) + i.qty); }));
  const draftPorNombre = new Map(draftItems.map((i) => [i.nombre, i]));
  const nombres = new Set([...draftPorNombre.keys(), ...totalEnRondas.keys()]);
  const itemsNuevos = [];
  const bloqueados = [];
  nombres.forEach((nombre) => {
    const deseado = draftPorNombre.get(nombre)?.qty || 0;
    const actual = totalEnRondas.get(nombre) || 0;
    const diff = deseado - actual;
    if (diff > 0) { itemsNuevos.push({ ...draftPorNombre.get(nombre), qty: diff }); return; }
    if (diff < 0) {
      let porQuitar = -diff;
      const itemReal = draftPorNombre.get(nombre) || rondas.flatMap((r) => r.items).find((i) => i.nombre === nombre) || { nombre };
      const esBebida = esItemBebida(itemReal);
      for (const r of rondas) {
        if (porQuitar <= 0) break;
        if (esBebida ? r.bebidaIniciada : r.comidaIniciada) continue;
        const idx = r.items.findIndex((i) => i.nombre === nombre);
        if (idx === -1) continue;
        const aQuitar = Math.min(r.items[idx].qty, porQuitar);
        r.items[idx].qty -= aQuitar;
        porQuitar -= aQuitar;
      }
      if (porQuitar > 0) bloqueados.push(nombre);
    }
  });
  rondas.forEach((r) => { r.items = r.items.filter((i) => i.qty > 0); });
  return { rondas, itemsNuevos, bloqueados };
}

const ACCOMPANIMENT_MAP = {
  'papa en gajo': 'Papa en gajo',
  'papas en gajos': 'Papa en gajo',
  'papas en gajo': 'Papa en gajo',
  'papa gajo': 'Papa en gajo',

  'aros cebolla': 'Aros de cebolla',
  'aros': 'Aros de cebolla'
};

function detectAccompaniment(nombre) {
  const normalized = nombre.toLowerCase();
  for (const [key, value] of Object.entries(ACCOMPANIMENT_MAP)) {
    if (normalized.includes(key)) {
      return value;
    }
  }
  return null;
}

function calculateInventoryDeductions(itemName) {
  const deductions = [];
  for (const [key, config] of Object.entries(INVENTORY_DEDUCTIONS)) {
    if (config.pattern(itemName)) {
      const mainDeductions = config.deductions(itemName);
      deductions.push(...mainDeductions);
      if (key === 'hamburguesas' || key === 'casadoChuleta' || key === 'casadoBistec') {
        const accompaniment = detectAccompaniment(itemName);
        if (accompaniment) {
          deductions.push({ nombre: accompaniment, cantidad: 1 });
        }
      }
      break;
    }
  }
  return deductions;
}

async function deductInventory(items) {
  try {
    const result = await runTransaction(db, async (transaction) => {
      const insufficientStock = [];
      const deductionsMap = {};
      items.forEach((item) => {
        const deductions = calculateInventoryDeductions(item.nombre);
        deductions.forEach((deduction) => {
          const key = deduction.nombre;
          deductionsMap[key] = (deductionsMap[key] || 0) + deduction.cantidad * (item.qty || 1);
        });
      });
      for (const [productName, totalToDeduct] of Object.entries(deductionsMap)) {
        const inventorySnap = await transaction.get(doc(db, 'inventario', productName));
        if (!inventorySnap.exists()) {
          insufficientStock.push(`"${productName}" no encontrado en inventario`);
          continue;
        }
        const currentStock = inventorySnap.data().cantidad || 0;
        if (currentStock < totalToDeduct) {
          insufficientStock.push(
            `"${productName}" insuficiente (disponible: ${currentStock}, necesario: ${totalToDeduct})`
          );
        } else {
          transaction.update(inventorySnap.ref, {
            cantidad: currentStock - totalToDeduct
          });
        }
      }
      return { insufficientStock };
    });
    if (result.insufficientStock.length > 0) {
      return {
        success: false,
        message: `Advertencia de stock: ${result.insufficientStock.join('; ')}`,
        insufficientStock: result.insufficientStock
      };
    }
    return {
      success: true,
      message: 'Inventario rebajado correctamente',
      insufficientStock: []
    };
  } catch (error) {
    console.error('Error al rebajar inventario:', error);
    return {
      success: false,
      message: `Error al procesar el inventario: ${error.message}`,
      insufficientStock: []
    };
  }
}

async function sendOrder() {
  if (state.draftItems.length === 0 || state.saving) return;
  setState({ saving: true });
  const tipo = SALON.includes(state.activeMesa) ? 'salon' : (LLEVAR.includes(state.activeMesa) ? 'llevar' : 'express');
  const payload = {
    mesa: String(state.activeMesa), tipo, origen: 'salon', mesero: state.mesero, clientName: `Mesa ${state.activeMesa}`,
    restaurantName: 'Los Pirchas', items: state.draftItems, total: draftTotal(), notes: state.notes.trim() || null,
    status: 'pending', mesaAbierta: true, updatedAt: serverTimestamp(),
  };
  try {
    let queued; let avisoBloqueo = null;
    if (state.activeOrderId) {
      const existente = state.pedidoExistente;
      const rondasPrevias = Array.isArray(existente?.rondas) && existente.rondas.length > 0 ? existente.rondas : (existente?.items?.length ? [{ id: 'r0', items: existente.items, comidaLista: !!existente.comidaLista, bebidaLista: !!existente.bebidaLista, comidaIniciada: existente.status !== 'pending', bebidaIniciada: existente.status !== 'pending', creadaEn: existente.createdAt || Date.now() }] : []);
      const { rondas: rondasActualizadas, itemsNuevos, bloqueados } = sincronizarRondas(rondasPrevias, state.draftItems);
      payload.rondas = itemsNuevos.length > 0 ? [...rondasActualizadas, { id: `r${Date.now()}`, items: itemsNuevos, comidaLista: false, bebidaLista: false, comidaIniciada: false, bebidaIniciada: false, creadaEn: Date.now() }] : rondasActualizadas;
      if (bloqueados.length > 0) avisoBloqueo = `⚠️ ${bloqueados.join(', ')} ya se está preparando — no se pudo quitar desde acá, avisale directo a cocina/bebidas si hace falta cambiarlo.`;
      ({ queued } = await writeAndContinue(setDoc(doc(db, 'orders', state.activeOrderId), payload, { merge: true })));
    } else {
      payload.rondas = [{ id: `r${Date.now()}`, items: state.draftItems, comidaLista: false, bebidaLista: false, comidaIniciada: false, bebidaIniciada: false, creadaEn: Date.now() }];
      const newRef = doc(collection(db, 'orders'));
      setState({ activeOrderId: newRef.id });
      ({ queued } = await writeAndContinue(setDoc(newRef, { ...payload, createdAt: serverTimestamp() })));
    }
    const inventoryResult = await deductInventory(state.draftItems);
    if (!inventoryResult.success) {
      console.warn('Advertencia de inventario:', inventoryResult.message);
    }
    setState({ saving: false, cartOpen: false, toast: avisoBloqueo || (queued ? 'Sin conexión — se enviará solo cuando vuelva la señal' : 'Pedido enviado a cocina') });
    setTimeout(() => { setState({ toast: null }); backToTables(); }, avisoBloqueo ? 4500 : (queued ? 3200 : 2200));
  } catch (err) {
    setState({ saving: false, toast: 'Error: ' + err.message });
    setTimeout(() => setState({ toast: null }), 3000);
  }
}

async function closeTable() {
  if (!state.activeOrderId || state.saving) return;
  setState({ saving: true });
  try {
    const { queued } = await writeAndContinue(updateDoc(doc(db, 'orders', state.activeOrderId), {
      status: 'delivered', mesaAbierta: false, paymentMethod: state.paymentMethod, total: draftTotal(),
      items: state.draftItems, closedAt: serverTimestamp(), updatedAt: serverTimestamp(),
    }));
    setState({ saving: false, paying: false, ...resetSplitState(), toast: queued ? 'Sin conexión — se cerrará solo cuando vuelva la señal' : 'Mesa cerrada y cobrada' });
    setTimeout(() => { setState({ toast: null }); backToTables(); }, queued ? 1800 : 1200);
  } catch (err) {
    setState({ saving: false, toast: 'Error: ' + err.message });
    setTimeout(() => setState({ toast: null }), 3000);
  }
}

async function closeTableSplit() {
  if (!state.activeOrderId || state.saving) return;
  if (unassignedCount() > 0) return;
  setState({ saving: true });
  const payments = state.splitPersonas.map((p, idx) => {
    const monto = personaTotal(p.id);
    const items = state.draftItems.map((it) => {
      const qty = getAssignments(it.nombre, it.qty).filter((pid) => pid === p.id).length;
      return qty > 0 ? { nombre: it.nombre, precio: it.precio, qty } : null;
    }).filter(Boolean);
    return { persona: `Persona ${idx + 1}`, metodo: p.metodo, monto, items };
  }).filter((p) => p.monto > 0);
  try {
    const { queued } = await writeAndContinue(updateDoc(doc(db, 'orders', state.activeOrderId), {
      status: 'delivered', mesaAbierta: false, paymentMethod: 'dividido', splitPayment: true, payments, total: draftTotal(),
      items: state.draftItems, closedAt: serverTimestamp(), updatedAt: serverTimestamp(),
    }));
    setState({ saving: false, paying: false, ...resetSplitState(), toast: queued ? 'Sin conexión — se cerrará solo cuando vuelva la señal' : 'Mesa cerrada y cobrada' });
    setTimeout(() => { setState({ toast: null }); backToTables(); }, queued ? 1800 : 1200);
  } catch (err) {
    setState({ saving: false, toast: 'Error: ' + err.message });
    setTimeout(() => setState({ toast: null }), 3000);
  }
}

async function deleteOrder() {
  if (!state.activeOrderId || state.saving) return;
  if (!window.confirm('¿Eliminar esta compra? No se podrá cobrar nada en esta mesa.')) return;
  setState({ saving: true });

    setState({ saving: false, cartOpen: false, toast: queued ? 'Sin conexión — se eliminará solo cuando vuelva la señal' : '🗑️ Compra eliminada' });

  } catch (err) {

  }
}

function floorPlanItem(mesa) {
  const order = findOpenOrder(mesa); const busy = !!order; const isTakeout = Number.isNaN(Number(mesa)); const label = isTakeout ? mesa.toUpperCase() : mesa;

    b.addEventListener('click', (e) => { e.stopPropagation(); removePersona(Number(b.dataset.removePersona)); });
  });
  document.querySelectorAll('[data-pay]').forEach((b) => {
    const persona = b.dataset.persona;
    if (persona) b.addEventListener('click', () => setPersonaMetodo(Number(persona), b.dataset.pay));
    else b.addEventListener('click', () => setState({ paymentMethod: b.dataset.pay }));
  });
  document.querySelectorAll('.split-toggle button').forEach((b) => {
    b.addEventListener('click', () => setCobroMode(b.dataset.mode));
  });
  document.querySelectorAll('.split-item__head').forEach((head) => {
    head.addEventListener('click', () => {
      const chips = head.nextElementSibling.querySelectorAll('.unit-chip');
      chips.forEach((chip) => { chip.click(); });
    });
  });
  document.querySelectorAll('.unit-chip').forEach((chip) => {
    const itemName = chip.dataset.item; const idx = Number(chip.dataset.idx); const qty = Number(chip.dataset.qty);
    chip.addEventListener('click', () => assignUnit(itemName, qty, idx));
  });
  const cancelPayBtn = document.getElementById('cancel-pay');
  if (cancelPayBtn) cancelPayBtn.addEventListener('click', () => setState({ paying: false, ...resetSplitState() }));
  const confirmPayBtn = document.getElementById('confirm-pay');
  if (confirmPayBtn) confirmPayBtn.addEventListener('click', closeTable);
  const confirmPaySplitBtn = document.getElementById('confirm-pay-split');
  if (confirmPaySplitBtn) confirmPaySplitBtn.addEventListener('click', closeTableSplit);
}

render();
</script>
</body>
</html>
