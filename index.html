<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Los Pirchas — Meseros</title>
<style>
  :root{
    --char-950:#171310; --char-900:#221b16; --char-700:#3a2c22;
    --flame-600:#d9391f; --flame-500:#e8792b; --ember-400:#f2a53a; --gold-200:#f6d98a;
    --paper:#fbf4ea; --paper-dim:#f3e6d5;
    --ink-900:#241c15; --ink-600:#6b5945; --ink-400:#8f7c68;
    --status-green:#3f9868; --red-500:#c92f1c;
    --font-display:'Bricolage Grotesque','Sora',system-ui,sans-serif;
    --font-body:'IBM Plex Sans',system-ui,sans-serif;
    --font-mono:'IBM Plex Mono','SFMono-Regular',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--char-950);color:var(--paper);font-family:var(--font-body);-webkit-tap-highlight-color:transparent;}
  #app{min-height:100%;display:flex;flex-direction:column;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea{font-family:inherit;}

  /* ---- Topbar ---- */
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
    padding:12px 14px;background:linear-gradient(180deg,var(--char-900),var(--char-950));
    border-bottom:1px solid var(--char-700);}
  .topbar__brand{font-family:var(--font-display);font-weight:700;font-size:17px;
    background:linear-gradient(90deg,var(--flame-600),var(--ember-400));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .topbar__spacer{flex:1;}
  .topbar__back{background:none;border:1px solid var(--char-700);color:var(--paper);
    border-radius:10px;padding:6px 10px;font-size:14px;}
  .topbar__mesero{font-size:12px;color:var(--ink-400);font-family:var(--font-mono);}
  .topbar__logout{background:none;border:1px solid var(--char-700);color:var(--ink-400);
    border-radius:10px;width:32px;height:32px;font-size:15px;line-height:1;margin-left:8px;}
  .topbar__dot{width:8px;height:8px;border-radius:50%;background:var(--status-green);}
  .topbar__dot.off{background:var(--red-500);}
  .cart-icon-btn{position:relative;background:var(--char-900);border:1px solid var(--char-700);
    color:var(--paper);border-radius:10px;padding:6px 10px;font-size:16px;line-height:1;}
  .cart-icon-badge{position:absolute;top:-6px;right:-6px;background:var(--flame-600);color:#fff;
    font-size:11px;font-weight:700;border-radius:999px;min-width:18px;height:18px;
    display:flex;align-items:center;justify-content:center;padding:0 4px;}
  .menu-section{margin-bottom:22px;}
  .menu-section__title{font-family:var(--font-display);font-size:15px;font-weight:700;
    color:var(--ember-400);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--char-700);}

  /* ---- Login screen ---- */
  .login{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;text-align:center;gap:16px;}
  .login__logo{font-family:var(--font-display);font-size:30px;font-weight:800;
    background:linear-gradient(90deg,var(--flame-600),var(--ember-400),var(--gold-200));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .login__sub{color:var(--ink-400);font-size:14px;margin-top:-8px;}
  .login input{width:100%;max-width:320px;padding:14px 16px;border-radius:12px;
    border:1px solid var(--char-700);background:var(--char-900);color:var(--paper);font-size:16px;}
  .login button{width:100%;max-width:320px;padding:14px;border-radius:12px;border:none;
    background:linear-gradient(90deg,var(--flame-600),var(--flame-500));color:#fff;
    font-weight:700;font-size:15px;}
  .login button:disabled{opacity:.4;}

  /* ---- Tables screen ---- */
  .screen{flex:1;padding:14px;overflow-y:auto;padding-bottom:90px;}
  .section-title{font-family:var(--font-display);font-size:13px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--ink-400);margin:18px 0 10px;}
  .section-title:first-child{margin-top:0;}
  .empty-hint{color:var(--ink-400);font-size:13px;padding:20px 4px;}

  /* ---- Mapa del salón (distribución física del local) ---- */
  .fp-legend{display:flex;gap:16px;align-items:center;font-size:12px;color:var(--ink-400);margin:0 0 12px;}
  .fp-legend span{display:flex;align-items:center;gap:6px;}
  .fp-legend i{width:12px;height:12px;border-radius:4px;display:inline-block;}
  .fp-legend i.free{background:linear-gradient(160deg,#2c4a3a,#1f3428);border:1px solid #3f9868;}
  .fp-legend i.busy{background:linear-gradient(160deg,var(--flame-600),#a12314);border:1px solid var(--flame-500);}
  .floor-plan-wrap{overflow:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--char-700);
    border-radius:14px;background:var(--char-900);padding:10px;}
  .floor-plan{position:relative;width:820px;aspect-ratio:100/62;}
  .fp-item{position:absolute;border-radius:10px;border:1px solid #3f9868;
    background:linear-gradient(160deg,#2c4a3a,#1f3428);color:var(--paper);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    font-weight:700;font-family:var(--font-body);line-height:1.15;text-align:center;padding:2px;}
  .fp-item.busy{background:linear-gradient(160deg,var(--flame-600),#a12314);border-color:var(--flame-500);}
  .fp-item small{font-family:var(--font-mono);font-weight:400;opacity:.85;}
  .fp-item.fp-small{font-size:11px;}
  .fp-item.fp-small small{font-size:8px;}
  .fp-item.fp-normal{font-size:14px;}
  .fp-item.fp-normal small{font-size:10px;}
  .fp-item.fp-big{font-size:17px;}
  .fp-item.fp-big small{font-size:11px;}
  .fp-item.fp-bottom{font-size:12px;border-radius:12px;}
  .fp-item.fp-bottom small{font-size:10px;}

  /* ---- Order screen ---- */
  .order-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;}
  .order-head h1{font-family:var(--font-display);font-size:20px;margin:0;}
  .order-head span{color:var(--ink-400);font-size:12px;font-family:var(--font-mono);}
  .cat-nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:12px;
    scrollbar-width:none;}
  .cat-nav::-webkit-scrollbar{display:none;}
  .cat-chip{flex:0 0 auto;padding:8px 14px;border-radius:999px;border:1px solid var(--char-700);
    background:var(--char-900);color:var(--paper-dim);font-size:13px;font-weight:600;white-space:nowrap;}
  .cat-chip.active{background:linear-gradient(90deg,var(--flame-600),var(--flame-500));
    border-color:transparent;color:#fff;}
  .item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
  .item-card{text-align:left;border-radius:14px;border:1px solid var(--char-700);
    background:var(--char-900);color:var(--paper);padding:12px;display:flex;flex-direction:column;
    gap:6px;min-height:84px;position:relative;}
  .item-card:active{transform:scale(.97);}
  .item-card.unavailable{opacity:.4;}
  .item-card__name{font-weight:700;font-size:14px;line-height:1.25;}
  .item-card__price{font-family:var(--font-mono);color:var(--ember-400);font-size:13px;}
  .item-card__badge{position:absolute;top:8px;right:8px;background:var(--flame-600);color:#fff;
    font-size:11px;font-weight:700;border-radius:999px;min-width:20px;height:20px;
    display:flex;align-items:center;justify-content:center;padding:0 5px;}

  /* ---- Cart floating bar / sheet ---- */
  .cart-bar{position:fixed;left:14px;right:14px;bottom:14px;z-index:30;
    background:linear-gradient(90deg,var(--flame-600),var(--flame-500));border-radius:16px;
    padding:14px 16px;display:flex;align-items:center;justify-content:space-between;
    box-shadow:0 8px 24px rgba(0,0,0,.4);color:#fff;font-weight:700;}
  .cart-bar span.count{background:rgba(255,255,255,.25);border-radius:999px;padding:2px 9px;
    font-size:12px;margin-right:8px;}
  .sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;
    align-items:flex-end;}
  .sheet{width:100%;max-height:82vh;background:var(--char-900);border-radius:20px 20px 0 0;
    padding:16px 16px 20px;overflow-y:auto;border-top:1px solid var(--char-700);}
  .sheet__handle{width:40px;height:4px;background:var(--char-700);border-radius:99px;margin:0 auto 14px;}
  .sheet h2{font-family:var(--font-display);margin:0 0 12px;font-size:18px;}
  .cart-row{padding:9px 0;border-bottom:1px solid var(--char-700);}
  .cart-row__top{display:flex;align-items:center;gap:10px;}
  .cart-row__name{flex:1;font-size:14px;}
  .cart-row__name small{display:block;color:var(--ink-400);font-family:var(--font-mono);font-size:12px;}
  .qty-ctrl{display:flex;align-items:center;gap:8px;}
  .qty-ctrl button{width:28px;height:28px;border-radius:8px;border:1px solid var(--char-700);
    background:var(--char-950);color:var(--paper);font-size:16px;line-height:1;}
  .cart-row__sub{font-family:var(--font-mono);font-size:13px;min-width:64px;text-align:right;}
  .cart-row__note{width:100%;margin-top:7px;padding:8px 10px;border-radius:8px;
    border:1px solid var(--char-700);background:var(--char-950);color:var(--paper);
    font-size:12.5px;}
  .cart-row__note::placeholder{color:var(--ink-400);}
  .cart-total{display:flex;justify-content:space-between;padding:14px 0 6px;font-weight:700;
    font-size:17px;}
  .sheet textarea{width:100%;margin-top:8px;padding:10px;border-radius:10px;border:1px solid var(--char-700);
    background:var(--char-950);color:var(--paper);resize:vertical;font-size:13px;}
  .sheet-actions{display:flex;gap:10px;margin-top:14px;}
  .btn-primary{flex:1;padding:14px;border-radius:12px;border:none;
    background:linear-gradient(90deg,var(--flame-600),var(--flame-500));color:#fff;font-weight:700;font-size:14px;}
  .btn-ghost{flex:1;padding:14px;border-radius:12px;border:1px solid var(--char-700);
    background:none;color:var(--paper);font-weight:700;font-size:14px;}
  .btn-primary:disabled,.btn-ghost:disabled{opacity:.4;}
  .close-x{position:absolute;right:14px;top:14px;background:none;border:none;color:var(--ink-400);font-size:20px;}
  .pay-row{display:flex;gap:8px;margin:10px 0;}
  .pay-chip{flex:1;padding:10px;border-radius:10px;border:1px solid var(--char-700);
    background:var(--char-950);color:var(--paper);font-size:13px;font-weight:600;}
  .pay-chip.active{background:linear-gradient(90deg,var(--flame-600),var(--flame-500));border-color:transparent;}

  /* ---- Dividir cuenta ---- */
  .split-toggle{display:flex;gap:8px;margin:4px 0 16px;background:var(--char-950);
    border:1px solid var(--char-700);border-radius:12px;padding:4px;}
  .split-toggle button{flex:1;padding:10px 6px;border-radius:9px;border:none;background:none;
    color:var(--ink-400);font-weight:700;font-size:12.5px;}
  .split-toggle button.active{background:linear-gradient(90deg,var(--flame-600),var(--flame-500));color:#fff;}
  .split-hint{color:var(--ink-400);font-size:12.5px;margin-bottom:10px;line-height:1.4;}
  .split-warning{color:var(--ember-400);font-size:12.5px;font-weight:600;margin:2px 0 10px;
    display:flex;align-items:center;gap:6px;}
  .split-personas{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .persona-chip{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;
    padding:8px 10px;border-radius:12px;border:2px solid var(--char-700);background:var(--char-950);
    color:var(--paper);min-width:84px;}
  .persona-chip .p-name{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;}
  .persona-chip .p-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
  .persona-chip .p-total{font-family:var(--font-mono);font-size:12px;color:var(--ink-400);}
  .persona-chip.active{border-color:var(--flame-500);background:var(--char-900);}
  .persona-chip__remove{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;
    background:var(--char-700);color:var(--paper);border:1px solid var(--char-950);font-size:12px;
    line-height:1;display:flex;align-items:center;justify-content:center;padding:0;}
  .persona-add{padding:8px 12px;border-radius:12px;border:1px dashed var(--char-700);
    background:none;color:var(--ink-400);font-size:12.5px;font-weight:700;min-width:84px;}
  .split-item{padding:10px 0;border-bottom:1px solid var(--char-700);}
  .split-item__head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .split-item__head .name{font-size:13.5px;font-weight:600;}
  .split-item__head .price{font-family:var(--font-mono);color:var(--ink-400);font-size:12px;}
  .unit-chips{display:flex;gap:7px;flex-wrap:wrap;}
  .unit-chip{width:34px;height:34px;border-radius:9px;border:1px solid var(--char-700);
    background:var(--char-950);color:var(--ink-400);font-family:var(--font-mono);font-weight:700;
    font-size:12px;display:flex;align-items:center;justify-content:center;}
  .unit-chip.assigned{color:#fff;border-color:transparent;}
  .split-summary{margin-top:16px;padding-top:4px;}
  .persona-pay{margin-bottom:14px;}
  .persona-pay__row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .persona-pay__name{font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px;}
  .persona-pay__total{font-family:var(--font-mono);font-size:13px;}
  .persona-pay .pay-row{margin:0 0 4px;}
  .persona-pay .pay-chip{font-size:11.5px;padding:7px;}
  .toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--status-green);
    color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:60;
    box-shadow:0 6px 18px rgba(0,0,0,.35);}
  .loading{flex:1;display:flex;align-items:center;justify-content:center;color:var(--ink-400);}
</style>
</head>
<body>
<div id="app"><div class="loading">Cargando…</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getFirestore, collection, doc, onSnapshot, addDoc, updateDoc,
  serverTimestamp, query, where
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

// Mismo proyecto Firebase que usan la web de cliente y el panel admin de Los Pirchas
const firebaseConfig = {
  apiKey: 'AIzaSyBLVHsF0VqPorPkK0auaWUH_4-k-loC6iU',
  authDomain: 'acosta-food.firebaseapp.com',
  projectId: 'acosta-food',
  storageBucket: 'acosta-food.firebasestorage.app',
  messagingSenderId: '605529235094',
  appId: '1:605529235094:web:035dff54f04af00654acb7',
  measurementId: 'G-QWEN1MWXXZ',
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app, 'default'); // el proyecto usa el ID de base "default", no "(default)"

// ---------- Utilidades ----------
const fmt = (v) => `₡${Number(v ?? 0).toLocaleString('es-CR')}`;
const root = document.getElementById('app');

const SALON = Array.from({ length: 28 }, (_, i) => String(i + 1));
const LLEVAR = ['Llevar 1', 'Llevar 2'];
const EXPRESS = ['Express 1', 'Express 2', 'Express 3'];

// Distribución física del salón (coordenadas % dentro del mapa), calcada de la
// foto del POS que envió el cliente: 3 grupos arriba (1-5 / 6-10 / 11-15),
// columna vertical a la derecha (16-19), mesas centrales escalonadas
// (21,23,25,27 arriba / 22,24,26,28 abajo) y la fila de Llevar/Express abajo.
const FLOORPLAN = {
  '1':  { left: 2,    top: 3,  width: 6,   height: 11 },
  '2':  { left: 9.5,  top: 3,  width: 6,   height: 11 },
  '3':  { left: 17,   top: 3,  width: 6,   height: 11 },
  '4':  { left: 24.5, top: 3,  width: 6,   height: 11 },
  '5':  { left: 32,   top: 3,  width: 6,   height: 11 },
  '6':  { left: 43,   top: 3,  width: 6,   height: 11 },
  '7':  { left: 50.5, top: 3,  width: 6,   height: 11 },
  '8':  { left: 58,   top: 3,  width: 6,   height: 11 },
  '9':  { left: 65.5, top: 3,  width: 6,   height: 11 },
  '10': { left: 73,   top: 3,  width: 6,   height: 11 },
  '11': { left: 81,   top: 3,  width: 3,   height: 11, small: true },
  '12': { left: 84.6, top: 3,  width: 3,   height: 11, small: true },
  '13': { left: 88.2, top: 3,  width: 3,   height: 11, small: true },
  '14': { left: 91.8, top: 3,  width: 3,   height: 11, small: true },
  '15': { left: 95.4, top: 3,  width: 3,   height: 11, small: true },
  '16': { left: 94,   top: 17, width: 5,   height: 9 },
  '17': { left: 94,   top: 28, width: 5,   height: 9 },
  '18': { left: 94,   top: 39, width: 5,   height: 9 },
  '19': { left: 94,   top: 50, width: 5,   height: 9 },
  '21': { left: 2,    top: 27, width: 15,  height: 15, big: true },
  '23': { left: 30,   top: 29, width: 12,  height: 13 },
  '25': { left: 52,   top: 29, width: 12,  height: 13 },
  '27': { left: 74,   top: 29, width: 12,  height: 13 },
  '22': { left: 17,   top: 48, width: 12,  height: 13 },
  '24': { left: 41,   top: 48, width: 12,  height: 13 },
  '26': { left: 63,   top: 48, width: 12,  height: 13 },
  '28': { left: 85,   top: 48, width: 10,  height: 13, small: true },
  'Llevar 1':  { left: 2,  top: 84, width: 18, height: 12, bottom: true },
  'Llevar 2':  { left: 22, top: 84, width: 18, height: 12, bottom: true },
  'Express 1': { left: 42, top: 84, width: 18, height: 12, bottom: true },
  'Express 2': { left: 62, top: 84, width: 18, height: 12, bottom: true },
  'Express 3': { left: 82, top: 84, width: 16, height: 12, bottom: true },
};

let state = {
  mesero: localStorage.getItem('pirchas-mesero') || '',
  screen: 'login',        // login | tables | order
  menuItems: [],
  openOrders: [],          // pedidos con mesaAbierta === true
  activeMesa: null,
  activeOrderId: null,     // id del pedido abierto de esa mesa (si existe)
  draftItems: [],          // {nombre, precio, qty}
  notes: '',
  category: null,
  cartOpen: false,
  paying: false,
  paymentMethod: 'efectivo',
  saving: false,
  toast: null,
  // ---- Dividir cuenta ----
  cobroMode: 'junto',       // 'junto' | 'dividir'
  splitPersonas: [],        // [{ id, metodo }]
  splitPersonaSeq: 0,       // contador para ids únicos de persona
  splitAssignments: {},     // { [nombreDelPlato]: [personaId|null, ...] } por unidad
  activePersonaId: null,    // persona "activa" para asignar tocando los platos
};

const PERSONA_COLORS = ['#d9391f', '#3f9868', '#2b6cb0', '#a83279', '#b58900', '#6b46c1', '#0f9b8e', '#c2410c'];

function setState(patch) {
  state = { ...state, ...patch };
  render();
}

// Actualiza el estado SIN redibujar la pantalla. Se usa para los datos que llegan
// en vivo desde Firestore (pedidos de otras mesas, cambios de menú) mientras el
// mesero está tocando algo en la pantalla de pedido/cobro: si se redibuja todo
// justo quando el dedo está sobre un botón (ej. "Persona 1" o una unidad de un
// plato al dividir cuenta), ese botón desaparece a mitad del toque y el tap se
// pierde. El dato igual queda guardado y se ve reflejado en el próximo redibujo.
function setStateQuiet(patch) {
  state = { ...state, ...patch };
}

// ---------- Firestore listeners ----------
onSnapshot(collection(db, 'Menu'), (snap) => {
  const menuItems = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  (state.paying ? setStateQuiet : setState)({ menuItems });
});

onSnapshot(
  query(collection(db, 'orders'), where('mesaAbierta', '==', true)),
  (snap) => {
    const openOrders = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    (state.paying ? setStateQuiet : setState)({ openOrders });
  },
  (err) => console.error('orders listener:', err)
);

// ---------- Helpers de datos ----------
function findOpenOrder(mesa) {
  return state.openOrders.find((o) => o.mesa === mesa) || null;
}

function groupedMenu() {
  const grouped = {};
  state.menuItems.forEach((it) => {
    const cat = it.categoria || 'Otros';
    grouped[cat] = grouped[cat] || [];
    grouped[cat].push(it);
  });
  return grouped;
}

function draftTotal() {
  return state.draftItems.reduce((s, i) => s + i.precio * i.qty, 0);
}
function draftCount() {
  return state.draftItems.reduce((s, i) => s + i.qty, 0);
}

// ---------- Acciones ----------
function openTable(mesa) {
  const existing = findOpenOrder(mesa);
  setState({
    screen: 'order',
    activeMesa: mesa,
    activeOrderId: existing ? existing.id : null,
    draftItems: existing ? existing.items.map((i) => ({ ...i })) : [],
    notes: existing ? (existing.notes || '') : '',
    category: null,
    cartOpen: false,
    paying: false,
    ...resetSplitState(),
  });
}

function backToTables() {
  setState({ screen: 'tables', activeMesa: null, activeOrderId: null, draftItems: [], cartOpen: false, ...resetSplitState() });
}

function addToDraft(item) {
  const items = [...state.draftItems];
  const idx = items.findIndex((i) => i.nombre === item.nombre);
  if (idx >= 0) items[idx] = { ...items[idx], qty: items[idx].qty + 1 };
  else items.push({ nombre: item.nombre, precio: item.precio, qty: 1, nota: '' });
  setState({ draftItems: items });
}

function changeQty(nombre, delta) {
  let items = state.draftItems.map((i) =>
    i.nombre === nombre ? { ...i, qty: i.qty + delta } : i
  );
  items = items.filter((i) => i.qty > 0);
  setState({ draftItems: items });
}

function setItemNota(nombre, nota) {
  const items = state.draftItems.map((i) => (i.nombre === nombre ? { ...i, nota } : i));
  setState({ draftItems: items });
}

// ---------- Dividir cuenta: helpers ----------
function resetSplitState() {
  return {
    cobroMode: 'junto',
    splitPersonas: [],
    splitPersonaSeq: 0,
    splitAssignments: {},
    activePersonaId: null,
  };
}

function getAssignments(nombre, qty) {
  const arr = (state.splitAssignments[nombre] || []).slice(0, qty);
  while (arr.length < qty) arr.push(null);
  return arr;
}

function setCobroMode(mode) {
  if (mode === 'dividir' && state.splitPersonas.length === 0) {
    setState({
      cobroMode: mode,
      splitPersonas: [{ id: 1, metodo: 'efectivo' }, { id: 2, metodo: 'efectivo' }],
      splitPersonaSeq: 2,
      activePersonaId: 1,
    });
  } else {
    setState({ cobroMode: mode });
  }
}

function addPersona() {
  if (state.splitPersonas.length >= 8) {
    setState({ toast: 'Máximo 8 personas' });
    setTimeout(() => setState({ toast: null }), 2000);
    return;
  }
  const seq = state.splitPersonaSeq + 1;
  setState({
    splitPersonas: [...state.splitPersonas, { id: seq, metodo: 'efectivo' }],
    splitPersonaSeq: seq,
    activePersonaId: seq,
  });
}

function removePersona(id) {
  if (state.splitPersonas.length <= 2) {
    setState({ toast: 'Se necesitan al menos 2 personas' });
    setTimeout(() => setState({ toast: null }), 2000);
    return;
  }
  const newAssignments = {};
  Object.keys(state.splitAssignments).forEach((nombre) => {
    newAssignments[nombre] = state.splitAssignments[nombre].map((pid) => (pid === id ? null : pid));
  });
  const newPersonas = state.splitPersonas.filter((p) => p.id !== id);
  setState({
    splitPersonas: newPersonas,
    splitAssignments: newAssignments,
    activePersonaId: state.activePersonaId === id ? newPersonas[0].id : state.activePersonaId,
  });
}

function setPersonaMetodo(id, metodo) {
  setState({ splitPersonas: state.splitPersonas.map((p) => (p.id === id ? { ...p, metodo } : p)) });
}

function assignUnit(nombre, qty, idx) {
  const arr = getAssignments(nombre, qty);
  const active = state.activePersonaId;
  arr[idx] = arr[idx] === active ? null : active;
  setState({ splitAssignments: { ...state.splitAssignments, [nombre]: arr } });
}

function personaTotal(personaId) {
  let total = 0;
  state.draftItems.forEach((it) => {
    getAssignments(it.nombre, it.qty).forEach((pid) => { if (pid === personaId) total += it.precio; });
  });
  return total;
}

function unassignedCount() {
  let count = 0;
  state.draftItems.forEach((it) => {
    getAssignments(it.nombre, it.qty).forEach((pid) => { if (pid === null) count++; });
  });
  return count;
}

async function sendOrder() {
  if (state.draftItems.length === 0 || state.saving) return;
  setState({ saving: true });
  const tipo = SALON.includes(state.activeMesa) ? 'salon' : (LLEVAR.includes(state.activeMesa) ? 'llevar' : 'express');
  const payload = {
    mesa: state.activeMesa,
    tipo,
    mesero: state.mesero,
    clientName: `Mesa ${state.activeMesa}`,
    restaurantName: 'Los Pirchas',
    items: state.draftItems,
    total: draftTotal(),
    notes: state.notes.trim() || null,
    status: 'pending',
    mesaAbierta: true,
    updatedAt: serverTimestamp(),
  };
  try {
    if (state.activeOrderId) {
      await updateDoc(doc(db, 'orders', state.activeOrderId), payload);
    } else {
      const ref = await addDoc(collection(db, 'orders'), { ...payload, createdAt: serverTimestamp() });
      setState({ activeOrderId: ref.id });
    }
    setState({ saving: false, cartOpen: false, toast: 'Pedido enviado a cocina' });
    setTimeout(() => setState({ toast: null }), 2200);
  } catch (err) {
    setState({ saving: false, toast: 'Error: ' + err.message });
    setTimeout(() => setState({ toast: null }), 3000);
  }
}

async function closeTable() {
  if (!state.activeOrderId || state.saving) return;
  setState({ saving: true });
  try {
    await updateDoc(doc(db, 'orders', state.activeOrderId), {
      status: 'delivered',
      mesaAbierta: false,
      paymentMethod: state.paymentMethod,
      total: draftTotal(),
      items: state.draftItems,
      closedAt: serverTimestamp(),
      updatedAt: serverTimestamp(),
    });
    setState({ saving: false, paying: false, ...resetSplitState(), toast: 'Mesa cerrada y cobrada' });
    setTimeout(() => { setState({ toast: null }); backToTables(); }, 1200);
  } catch (err) {
    setState({ saving: false, toast: 'Error: ' + err.message });
    setTimeout(() => setState({ toast: null }), 3000);
  }
}

async function closeTableSplit() {
  if (!state.activeOrderId || state.saving) return;
  if (unassignedCount() > 0) return;
  setState({ saving: true });
  const payments = state.splitPersonas
    .map((p, idx) => {
      const monto = personaTotal(p.id);
      const items = state.draftItems
        .map((it) => {
          const qty = getAssignments(it.nombre, it.qty).filter((pid) => pid === p.id).length;
          return qty > 0 ? { nombre: it.nombre, precio: it.precio, qty } : null;
        })
        .filter(Boolean);
      return { persona: `Persona ${idx + 1}`, metodo: p.metodo, monto, items };
    })
    .filter((p) => p.monto > 0);
  try {
    await updateDoc(doc(db, 'orders', state.activeOrderId), {
      status: 'delivered',
      mesaAbierta: false,
      paymentMethod: 'dividido',
      splitPayment: true,
      payments,
      total: draftTotal(),
      items: state.draftItems,
      closedAt: serverTimestamp(),
      updatedAt: serverTimestamp(),
    });
    setState({ saving: false, paying: false, ...resetSplitState(), toast: 'Mesa cerrada y cobrada' });
    setTimeout(() => { setState({ toast: null }); backToTables(); }, 1200);
  } catch (err) {
    setState({ saving: false, toast: 'Error: ' + err.message });
    setTimeout(() => setState({ toast: null }), 3000);
  }
}

function startMesero(name) {
  localStorage.setItem('pirchas-mesero', name);
  setState({ mesero: name, screen: 'tables' });
}

function logout() {
  if (!window.confirm('¿Cerrar sesión? Vas a tener que escribir tu nombre de nuevo.')) return;
  localStorage.removeItem('pirchas-mesero');
  setState({
    mesero: '',
    screen: 'login',
    activeMesa: null,
    activeOrderId: null,
    draftItems: [],
    notes: '',
    cartOpen: false,
    paying: false,
  });
}

// ---------- Render ----------
function render() {
  // Guardamos el scroll actual para restaurarlo después de redibujar: si no,
  // cada toque (incluso uno que no tiene nada que ver con el scroll) manda la
  // pantalla y la hoja de cobro de vuelta arriba del todo.
  const screenEl = document.querySelector('.screen');
  const sheetEl = document.getElementById('sheet');
  const screenScroll = screenEl ? screenEl.scrollTop : null;
  const sheetScroll = sheetEl ? sheetEl.scrollTop : null;

  if (!state.mesero && state.screen !== 'tables') {
    // primera carga
  }
  if (state.screen === 'login' || !state.mesero) {
    renderLogin();
  } else if (state.screen === 'tables') {
    renderTables();
  } else if (state.screen === 'order') {
    renderOrder();
  }

  if (screenScroll !== null) {
    const newScreenEl = document.querySelector('.screen');
    if (newScreenEl) newScreenEl.scrollTop = screenScroll;
  }
  if (sheetScroll !== null) {
    const newSheetEl = document.getElementById('sheet');
    if (newSheetEl) newSheetEl.scrollTop = sheetScroll;
  }
}

function renderLogin() {
  root.innerHTML = `
    <div class="login">
      <div class="login__logo">🔥 Los Pirchas</div>
      <div class="login__sub">Toma de pedidos — Meseros</div>
      <input id="mesero-input" placeholder="Tu nombre" autocomplete="off" />
      <button id="mesero-go" disabled>Empezar turno</button>
    </div>
  `;
  const input = document.getElementById('mesero-input');
  const btn = document.getElementById('mesero-go');
  input.addEventListener('input', () => { btn.disabled = !input.value.trim(); });
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && input.value.trim()) startMesero(input.value.trim()); });
  btn.addEventListener('click', () => startMesero(input.value.trim()));
}

function floorPlanItem(mesa) {
  const cfg = FLOORPLAN[mesa];
  const order = findOpenOrder(mesa);
  const busy = !!order;
  const sizeClass = cfg.big ? 'fp-big' : cfg.bottom ? 'fp-bottom' : cfg.small ? 'fp-small' : 'fp-normal';
  const label = cfg.bottom ? mesa.toUpperCase() : mesa;
  return `
    <button class="fp-item ${sizeClass} ${busy ? 'busy' : ''}"
      style="left:${cfg.left}%;top:${cfg.top}%;width:${cfg.width}%;height:${cfg.height}%;"
      data-mesa="${mesa}">
      ${label}
      ${busy ? `<small>${fmt(order.total)}</small>` : ''}
    </button>
  `;
}

function slugify(text) {
  return text
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-');
}

function bindCartSheetEvents() {
  const overlay = document.getElementById('sheet-overlay');
  if (!overlay) return;
  overlay.addEventListener('click', (e) => { if (e.target === overlay) setState({ cartOpen: false, paying: false }); });
  document.getElementById('sheet-close').addEventListener('click', () => setState({ cartOpen: false, paying: false }));
  root.querySelectorAll('[data-inc]').forEach((b) => b.addEventListener('click', () => changeQty(decodeURIComponent(b.dataset.inc), 1)));
  root.querySelectorAll('[data-dec]').forEach((b) => b.addEventListener('click', () => changeQty(decodeURIComponent(b.dataset.dec), -1)));
  root.querySelectorAll('[data-note]').forEach((inp) => inp.addEventListener('change', () => setItemNota(decodeURIComponent(inp.dataset.note), inp.value)));
  const notesInput = document.getElementById('notes-input');
  if (notesInput) notesInput.addEventListener('change', () => setState({ notes: notesInput.value }));

  const sendBtn = document.getElementById('send-order');
  if (sendBtn) sendBtn.addEventListener('click', sendOrder);
  const printBtn = document.getElementById('print-receipt');
  if (printBtn) printBtn.addEventListener('click', printReceipt);
  const goPay = document.getElementById('go-pay');
  if (goPay) goPay.addEventListener('click', () => setState({ paying: true }));
  const cancelPay = document.getElementById('cancel-pay');
  if (cancelPay) cancelPay.addEventListener('click', () => setState({ paying: false }));
  const confirmPay = document.getElementById('confirm-pay');
  if (confirmPay) confirmPay.addEventListener('click', closeTable);
  root.querySelectorAll('[data-pay]').forEach((b) => b.addEventListener('click', () => setState({ paymentMethod: b.dataset.pay })));

  // ---- Dividir cuenta ----
  root.querySelectorAll('[data-mode]').forEach((b) => b.addEventListener('click', () => setCobroMode(b.dataset.mode)));
  const confirmPaySplit = document.getElementById('confirm-pay-split');
  if (confirmPaySplit) confirmPaySplit.addEventListener('click', closeTableSplit);
  const addPersonaBtn = document.getElementById('add-persona');
  if (addPersonaBtn) addPersonaBtn.addEventListener('click', addPersona);
  root.querySelectorAll('[data-remove-persona]').forEach((b) => b.addEventListener('click', (e) => {
    e.stopPropagation();
    removePersona(Number(b.dataset.removePersona));
  }));
  root.querySelectorAll('.persona-chip').forEach((b) => b.addEventListener('click', () => setState({ activePersonaId: Number(b.dataset.persona) })));
  root.querySelectorAll('[data-unit-nombre]').forEach((b) => b.addEventListener('click', () =>
    assignUnit(decodeURIComponent(b.dataset.unitNombre), Number(b.dataset.unitQty), Number(b.dataset.unitIdx))
  ));
  root.querySelectorAll('[data-persona-pay]').forEach((b) => b.addEventListener('click', () =>
    setPersonaMetodo(Number(b.dataset.personaPay), b.dataset.personaPayMethod)
  ));
}

// Primer render
setState({ screen: state.mesero ? 'tables' : 'login' });
</script>
</body>
</html>
