.persona-pay__name{font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px;}

.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--char-900);border:1px solid var(--char-700);padding:12px 16px;border-radius:12px;color:var(--paper);font-size:13px;z-index:50;max-width:90%;text-align:center;}

];

const PERSONA_COLORS = ['#d9391f','#e8792b','#f2a53a','#3f9868','#4d9dd6','#7c3aed','#ec4899','#f97316'];

const state = {
  mesero: localStorage.getItem('mesero') || '',

  menuItems: [],

  activeOrderId: null,
  draftItems: [],

  baldazoSelected: [],
  toast: ''
};

function setState(updates) {
  Object.assign(state, updates);
  render();
}

function normalizeText(text) {
  return text.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
}

const BEBIDA_ALIASES = ['bebida','batido','gaseosa','cerveza','licor','jugo','smoothie','cafe','helado','refresco','baldazo'];

function filteredMenuItems() {
  const term = normalizeText(state.menuSearch);
  if (!term) return state.menuItems;
  return state.menuItems.filter((it) => {
    const nombre = normalizeText(it.nombre);
    const categoria = normalizeText(it.categoria);
    if (nombre.includes(term) || categoria.includes(term)) return true;
    if (BEBIDA_ALIASES.includes(term)) {
      return BEBIDA_ALIASES.some((alias) => categoria.includes(alias));
    }
    if (BEBIDA_ALIASES.some((alias) => alias.includes(term))) {
      return BEBIDA_ALIASES.some((alias) => categoria.includes(alias));
    }
    return false;
  });
}

function groupedMenu(items = state.menuItems) {
  const grouped = {};
  items.forEach((it) => { const cat = it.categoria || 'Otros'; grouped[cat] = grouped[cat] || []; grouped[cat].push(it); });
  return grouped;
}

function sortCategories(cats, order = []) {
  const sorted = [...order.filter((c) => cats.includes(c)), ...cats.filter((c) => !order.includes(c))];
  return sorted;
}

function groupBySubcategoria(categoria, items = []) {
  const grouped = {};
  items.forEach((it) => { const sub = it.subcategoria || ''; grouped[sub] = grouped[sub] || []; grouped[sub].push(it); });
  return Object.entries(grouped).map(([subcategoria, platos]) => ({ subcategoria, platos }));
}

function fmt(n) { return new Intl.NumberFormat('es-CR', { style: 'currency', currency: 'CRC', minimumFractionDigits: 0 }).format(n); }

function findOpenOrder(mesa) { return state.openOrders.find((o) => o.mesa === String(mesa)) || null; }

function draftTotal() { return state.draftItems.reduce((s, i) => s + i.precio * i.qty, 0); }
function draftCount() { return state.draftItems.reduce((s, i) => s + i.qty, 0); }

function openTable(mesa) {
  const existing = findOpenOrder(mesa);
  setState({
    screen: 'order',
    activeMesa: mesa,
    activeOrderId: existing ? existing.id : null,
    pedidoExistente: existing || null,
    draftItems: existing ? existing.items.map((i) => ({ ...i })) : [],
    notes: existing ? (existing.notes || '') : '',
    category: null,
    menuSearch: '',
    paying: false,
    splitPersonas: [],
    activePersonaId: null,
    cobroMode: 'junto'
  });
}

function backToTables() {
  setState({
    screen: 'tables',
    draftItems: [],
    notes: '',
    cartOpen: false,
    menuSearch: '',
    paying: false,
    splitPersonas: [],
    activePersonaId: null,
    cobroMode: 'junto'
  });
}

function addToDraft(item) {
  const existing = state.draftItems.find((i) => i.nombre === item.nombre);
  if (existing) {
    existing.qty += 1;
  } else {
    state.draftItems.push({ ...item, qty: 1, nota: '' });
  }
  setState({ draftItems: [...state.draftItems], toast: '✓ Agregado' });
  setTimeout(() => setState({ toast: '' }), 1500);
}

function changeQty(nombre, delta) {
  const item = state.draftItems.find((i) => i.nombre === nombre);
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) {
    state.draftItems = state.draftItems.filter((i) => i.nombre !== nombre);
  }
  setState({ draftItems: [...state.draftItems] });
}

function setItemNota(nombre, nota) {
  const item = state.draftItems.find((i) => i.nombre === nombre);
  if (item) item.nota = nota;
}

async function sendOrder() {
  setState({ saving: true });
  try {
    if (state.activeOrderId) {
      const orderRef = doc(db, 'orders', state.activeOrderId);
      await updateDoc(orderRef, {
        items: state.draftItems,
        notes: state.notes,
        actualizadoEn: serverTimestamp()
      });
    } else {
      await addDoc(collection(db, 'orders'), {
        mesa: String(state.activeMesa),
        items: state.draftItems,
        notes: state.notes,
        mesero: state.mesero,
        creadoEn: serverTimestamp(),
        actualizadoEn: serverTimestamp(),
        estado: 'pendiente'
      });
    }
    setState({ draftItems: [], notes: '', cartOpen: false, toast: '✓ Pedido enviado a cocina' });
    setTimeout(() => setState({ toast: '' }), 2000);
  } catch (e) {
    console.error('Error:', e);
    setState({ saving: false, toast: '✗ Error al enviar' });
  }
}

async function saveDraft() {
  setState({ saving: true });
  try {
    if (state.activeOrderId) {
      const orderRef = doc(db, 'orders', state.activeOrderId);
      await updateDoc(orderRef, {
        items: state.draftItems,
        notes: state.notes,
        actualizadoEn: serverTimestamp()
      });
    } else {
      await addDoc(collection(db, 'orders'), {
        mesa: String(state.activeMesa),
        items: state.draftItems,
        notes: state.notes,
        mesero: state.mesero,
        creadoEn: serverTimestamp(),
        actualizadoEn: serverTimestamp(),
        estado: 'borrador'
      });
    }
    setState({ toast: '✓ Comanda guardada' });
    setTimeout(() => setState({ toast: '' }), 1500);
  } catch (e) {
    console.error('Error:', e);
  } finally {
    setState({ saving: false });
  }
}

async function deleteOrder() {
  if (!state.activeOrderId) return;
  if (!confirm('¿Eliminar esta orden? No se podrá recuperar.')) return;
  setState({ saving: true });
  try {
    await deleteDoc(doc(db, 'orders', state.activeOrderId));
    setState({ draftItems: [], notes: '', cartOpen: false, activeOrderId: null, toast: '✓ Orden eliminada' });
    setTimeout(() => setState({ toast: '' }), 1500);
  } catch (e) {
    console.error('Error:', e);
    setState({ saving: false, toast: '✗ Error' });
  }
}

function printReceipt() {
  const content = `
    Mesa ${state.activeMesa}
    ${new Date().toLocaleString('es-CR')}

    ${state.draftItems.map((i) => `${i.nombre} x${i.qty} ${fmt(i.precio * i.qty)}${i.nota ? ' (' + i.nota + ')' : ''}`).join('\n')}

    Total: ${fmt(draftTotal())}
  `;
  const win = window.open('', '', 'width=400,height=600');
  win.document.write('<pre>' + content + '</pre>');
  win.document.close();
  win.print();
}

function toggleBaldazoBeer(beerName) {
  const idx = state.baldazoSelected.indexOf(beerName);
  if (idx >= 0) {
    state.baldazoSelected.splice(idx, 1);
  } else if (state.baldazoSelected.length < 6) {
    state.baldazoSelected.push(beerName);
  }
  setState({ baldazoSelected: [...state.baldazoSelected] });
}

function confirmBaldazo() {
  if (state.baldazoSelected.length !== 6) {
    setState({ toast: 'Selecciona exactamente 6 cervezas' });
    setTimeout(() => setState({ toast: '' }), 2000);
    return;
  }
  const baldazoItem = {
    nombre: `🍺 Baldazo (${state.baldazoSelected.join(', ')})`,
    precio: 6000,
    qty: 1,
    nota: '',
    detalles: state.baldazoSelected
  };
  addToDraft(baldazoItem);
  setState({ baldazoModalOpen: false, baldazoSelected: [], cartOpen: true });
}

function addPersona() {
  if (state.splitPersonas.length >= 8) return;
  const newId = Math.max(0, ...state.splitPersonas.map((p) => p.id)) + 1;
  state.splitPersonas.push({ id: newId, metodo: 'efectivo' });
  setState({ splitPersonas: [...state.splitPersonas], activePersonaId: newId });
}

function removePersona(id) {
  state.splitPersonas = state.splitPersonas.filter((p) => p.id !== id);
  setState({
    splitPersonas: [...state.splitPersonas],
    activePersonaId: state.splitPersonas.length > 0 ? state.splitPersonas[0].id : null,
    draftItems: state.draftItems.map((i) => ({
      ...i,
      asignaciones: (i.asignaciones || []).filter((a) => a.personaId !== id)
    }))
  });
}

function setCobroMode(mode) {
  setState({
    cobroMode: mode,
    splitPersonas: mode === 'junto' ? [] : state.splitPersonas.length === 0 ? [{ id: 1, metodo: 'efectivo' }] : state.splitPersonas,
    activePersonaId: mode === junto' ? null : (state.activePersonaId || (state.splitPersonas[0]?.id || 1))
  });
}

function assignUnit(itemName, qty, idx) {
  const item = state.draftItems.find((i) => i.nombre === itemName);
  if (!item) return;
  item.asignaciones = item.asignaciones || [];
  item.asignaciones[idx] = state.activePersonaId;
  setState({ draftItems: [...state.draftItems] });
}

function getAssignments(itemName, qty) {
  const item = state.draftItems.find((i) => i.nombre === itemName);
  if (!item?.asignaciones) return Array(qty).fill(null);
  return item.asignaciones.slice(0, qty).concat(Array(Math.max(0, qty - (item.asignaciones?.length || 0))).fill(null));
}

function unassignedCount() {
  let count = 0;
  state.draftItems.forEach((it) => {
    const arr = getAssignments(it.nombre, it.qty);
    count += arr.filter((p) => p === null).length;
  });
  return count;
}

function personaTotal(personaId) {
  let total = 0;
  state.draftItems.forEach((it) => {
    const arr = getAssignments(it.nombre, it.qty);
    const count = arr.filter((p) => p === personaId).length;
    total += count * it.precio;
  });
  return total;
}

function setPersonaMetodo(personaId, metodo) {
  const p = state.splitPersonas.find((x) => x.id === personaId);
  if (p) p.metodo = metodo;
  setState({ splitPersonas: [...state.splitPersonas] });
}

async function closeTable() {
  setState({ saving: true });
  try {
    if (state.activeOrderId) {
      const orderRef = doc(db, 'orders', state.activeOrderId);
      await updateDoc(orderRef, { estado: 'pagado', actualizadoEn: serverTimestamp() });
    }
    setState({
      draftItems: [], notes: '', cartOpen: false, paying: false, screen: 'tables',
      toast: '✓ Mesa cerrada'
    });
    setTimeout(() => setState({ toast: '' }), 1500);
  } catch (e) {
    console.error('Error:', e);
  } finally {
    setState({ saving: false });
  }
}

async function closeTableSplit() {
  setState({ saving: true });
  try {
    if (state.activeOrderId) {
      const orderRef = doc(db, 'orders', state.activeOrderId);
      await updateDoc(orderRef, { estado: 'pagado', actualizadoEn: serverTimestamp() });
    }
    setState({
      draftItems: [], notes: '', cartOpen: false, paying: false, screen: 'tables',
      toast: '✓ Mesa cerrada'
    });
    setTimeout(() => setState({ toast: '' }), 1500);
  } catch (e) {
    console.error('Error:', e);
  } finally {
    setState({ saving: false });
  }
}

function slugify(text) {
  return text.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-');
}

function renderLogin() {
  root.innerHTML = `<div class="login"><div class="login__logo">🔥 Los Pirchas</div><div class="login__sub">Toma de pedidos — Meseros</div><input id="mesero-input" placeholder="Tu nombre" autocomplete="off" /><button id="mesero-go" disabled>Empezar turno</button></div>`;
  const input = document.getElementById('mesero-input');
  const btn = document.getElementById('mesero-go');
  input.addEventListener('input', () => { btn.disabled = !input.value.trim(); });
  btn.addEventListener('click', () => {
    const name = input.value.trim();
    if (name) {
      localStorage.setItem('mesero', name);
      setState({ mesero: name, screen: 'tables' });
    }
  });
}

function renderTables() {
  const mesas = Array.from({ length: 25 }, (_, i) => i + 1);
  root.innerHTML = `<div class="topbar"><div class="topbar__brand">🔥 Los Pirchas</div><div class="topbar__spacer"></div><span class="topbar__mesero">${state.mesero}</span><button class="topbar__logout" id="logout">🚪</button></div><div class="screen"><div class="section-title">Mesas</div><div class="fp-legend"><span><i class="free"></i>Disponible</span><span><i class="busy"></i>Ocupada</span></div><div class="floor-plan-wrap"><div class="floor-plan"><div class="fp-row"><div class="fp-row--inner"><div class="fp-cluster"><div class="fp-cluster--col">${mesas.slice(0, 5).map((m) => { const o = findOpenOrder(m); return `<button class="fp-item ${o ? 'busy' : ''}" data-mesa="${m}">${m}</button>`; }).join('')}</div></div></div><div class="fp-cluster fp-cluster--right"><div class="fp-cluster--col">${mesas.slice(5, 10).map((m) => { const o = findOpenOrder(m); return `<button class="fp-item ${o ? 'busy' : ''}" data-mesa="${m}">${m}</button>`; }).join('')}</div></div></div><div class="fp-row"><div class="fp-row--inner"><div class="fp-cluster"><div class="fp-cluster--col">${mesas.slice(10, 15).map((m) => { const o = findOpenOrder(m); return `<button class="fp-item ${o ? 'busy' : ''}" data-mesa="${m}">${m}</button>`; }).join('')}</div></div></div><div class="fp-cluster fp-cluster--right"><div class="fp-cluster--col">${mesas.slice(15, 20).map((m) => { const o = findOpenOrder(m); return `<button class="fp-item ${o ? 'busy' : ''}" data-mesa="${m}">${m}</button>`; }).join('')}</div></div></div><div class="fp-row"><div class="fp-row--inner"><div class="fp-cluster"><div class="fp-cluster--col">${mesas.slice(20, 25).map((m) => { const o = findOpenOrder(m); return `<button class="fp-item ${o ? 'busy' : ''}" data-mesa="${m}">${m}</button>`; }).join('')}</div></div></div></div></div></div></div>${state.toast ? `<div class="toast">${state.toast}</div>` : ''}`;
  document.getElementById('logout').addEventListener('click', () => {
    localStorage.removeItem('mesero');
    setState({ mesero: '', screen: 'login' });
  });
  root.querySelectorAll('[data-mesa]').forEach((b) => {
    b.addEventListener('click', () => openTable(Number(b.dataset.mesa)));
  });
}

function renderOrder() {
  const searchTerm = state.menuSearch.trim();
  const filtered = filteredMenuItems();
  const grouped = groupedMenu(filtered);
  const categories = sortCategories(Object.keys(grouped), state.categoryOrder);
  const hasMenu = state.menuItems.length > 0;

  root.innerHTML = `<div class="topbar"><button class="topbar__back" id="back-btn">← Mesas</button><div class="topbar__spacer"></div><div class="topbar__mesero">${state.mesero}</div><button class="cart-icon-btn" id="cart-icon">🧾 ${draftCount() > 0 ? `<span class="cart-icon-badge">${draftCount()}</span>` : ''}</button></div><div class="screen"><div class="menu-sticky-head"><div class="order-head"><h1>Mesa ${state.activeMesa}</h1><span>${state.activeOrderId ? 'Pedido abierto' : 'Pedido nuevo'}</span></div>${!hasMenu ? '' : `<div class="menu-search-wrap"><input id="menu-search" class="menu-search" type="text" inputmode="search" placeholder="Buscar plato..." value="${state.menuSearch.replace(/"/g, '&quot;')}" autocomplete="off" />${searchTerm ? `<button class="menu-search__clear" id="menu-search-clear">✕</button>` : ''}</div>${!searchTerm ? `<div class="cat-nav">${categories.map((c) => `<button class="cat-chip" data-jump="${slugify(c)}">${c}</button>`).join('')}</div>` : ''}`}</div>${!hasMenu ? `<div class="empty-hint">El menú todavía no tiene platos cargados.</div>` : `${categories.length === 0 ? `<div class="empty-hint">No se encontraron platos para "${searchTerm}".</div>` : categories.map((cat) => `<div class="menu-section" id="cat-${slugify(cat)}"><div class="menu-section__title">${cat}</div><div class="item-grid">${grouped[cat].map((it) => `<button class="item-card" data-item='${encodeURIComponent(JSON.stringify(it))}'>${state.draftItems.find((d) => d.nombre === it.nombre) ? `<span class="item-card__badge">${state.draftItems.find((d) => d.nombre === it.nombre).qty}</span>` : ''}<div class="item-card__name">${it.nombre}</div><div class="item-card__price">${fmt(it.precio)}</div></button>`).join('')}</div></div>`).join('')}${searchTerm && categories.length === 0 ? '' : `<div class="menu-section"><div class="menu-section__title">🍺 Especial</div><div class="item-grid"><button class="item-card" id="baldazo-btn"><div class="item-card__name">🍺 Baldazo</div><div class="item-card__price">${fmt(6000)}</div></button></div></div>`}`}</div>${draftCount() > 0 && !state.cartOpen ? `<div class="cart-bar" id="open-cart"><span><span class="count">${draftCount()}</span>Ver pedido</span><span>${fmt(draftTotal())}</span></div>` : ''}${state.cartOpen ? renderCartSheet() : ''}${state.baldazoModalOpen ? renderBaldazoModal() : ''}${state.toast ? `<div class="toast">${state.toast}</div>` : ''}`;

  document.getElementById('back-btn').addEventListener('click', backToTables);
  document.getElementById('cart-icon').addEventListener('click', () => setState({ cartOpen: true }));
  const baldazoBtn = document.getElementById('baldazo-btn');
  if (baldazoBtn) baldazoBtn.addEventListener('click', () => setState({ baldazoModalOpen: true, baldazoSelected: [] }));

  root.querySelectorAll('.cat-chip').forEach((b) => {
    b.addEventListener('click', () => {
      document.getElementById('cat-' + b.dataset.jump)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });

  root.querySelectorAll('[data-item]').forEach((b) => {
    b.addEventListener('click', () => addToDraft(JSON.parse(decodeURIComponent(b.dataset.item))));
  });

  const openCart = document.getElementById('open-cart');
  if (openCart) openCart.addEventListener('click', () => setState({ cartOpen: true }));

  bindCartSheetEvents();
}

function renderBaldazoModal() {
  const todas = [...CERVEZAS_NACIONALES, ...CERVEZAS_INTERNACIONALES];
  return `<div class="baldazo-overlay" id="baldazo-overlay"><div class="baldazo-modal" id="baldazo-modal"><div class="baldazo-modal__handle"></div><div class="baldazo-modal__title">🍺 Baldazo (₡6.000)</div><div class="baldazo-counter">Selecciona exactamente 6 cervezas (${state.baldazoSelected.length}/6)</div><div class="baldazo-grid" id="baldazo-grid">${todas.map((beer) => `<button class="baldazo-beer ${state.baldazoSelected.includes(beer.nombre) ? 'selected' : ''} ${state.baldazoSelected.length >= 6 && !state.baldazoSelected.includes(beer.nombre) ? 'disabled' : ''}" data-beer="${beer.nombre}">${beer.nombre}<br><small>${fmt(beer.precio)}</small></button>`).join('')}</div><div class="baldazo-actions"><button class="btn-ghost" id="baldazo-cancel">Cancelar</button><button class="btn-primary" id="baldazo-confirm" ${state.baldazoSelected.length !== 6 ? 'disabled' : ''}>Confirmar selección</button></div></div></div>`;
}

function renderCartSheet() {
  const paymentOptions = [{ key: 'efectivo', label: 'Efectivo' }, { key: 'sinpe', label: 'SINPE' }, { key: 'tarjeta', label: 'Tarjeta' }];
  return `<div class="sheet-overlay" id="sheet-overlay"><div class="sheet" id="sheet"><button class="close-x" id="sheet-close">✕</button><div class="sheet__handle"></div><h2>Mesa ${state.activeMesa}</h2>${state.draftItems.length === 0 ? `<div class="empty-hint">Sin artículos</div>` : ''}${state.draftItems.map((i) => `<div class="cart-row"><div class="cart-row__top"><div class="cart-row__name">${i.nombre}<small>${fmt(i.precio)} c/u</small></div><div class="qty-ctrl"><button data-dec="${encodeURIComponent(i.nombre)}">−</button><span>${i.qty}</span><button data-inc="${encodeURIComponent(i.nombre)}">+</button></div><div class="cart-row__sub">${fmt(i.precio * i.qty)}</div></div><input class="cart-row__note" data-note="${encodeURIComponent(i.nombre)}" placeholder="Agregar o quitar algo" value="${(i.nota || '').replace(/"/g, '&quot;')}" /></div>`).join('')}<textarea id="notes-input" placeholder="Notas para cocina" rows="2">${state.notes}</textarea><div class="cart-total"><span>Total</span><span>${fmt(draftTotal())}</span></div>${state.draftItems.length > 0 ? `<div class="sheet-actions"><button class="btn-ghost" id="print-receipt">🖨️ Imprimir</button></div>` : ''}${!state.paying ? `<div class="sheet-actions"><button class="btn-secondary" id="save-draft" ${state.draftItems.length === 0 || state.saving ? 'disabled' : ''}>💾 Guardar</button><button class="btn-primary" id="send-order" ${state.draftItems.length === 0 || state.saving ? 'disabled' : ''}>${state.saving ? 'Enviando…' : '📤 Cocina'}</button></div>${state.activeOrderId ? `<div class="sheet-actions"><button class="btn-ghost" id="go-pay">Cobrar</button><button class="btn-ghost" id="delete-order" style="color:var(--red-500);">🗑️ Eliminar</button></div>` : ''}` : `<div class="sheet-actions"><button class="btn-ghost" id="cancel-pay">Cancelar</button><button class="btn-primary" id="confirm-pay" ${state.saving ? 'disabled' : ''}>${state.saving ? 'Cerrando…' : 'Cobrar'}</button></div><div class="pay-row">${paymentOptions.map((p) => `<button class="pay-chip ${state.paymentMethod === p.key ? 'active' : ''}" data-pay="${p.key}">${p.label}</button>`).join('')}</div>`}</div></div>`;
}

function bindCartSheetEvents() {
  const overlay = document.getElementById('sheet-overlay');
  if (!overlay) return;
  overlay.addEventListener('click', (e) => { if (e.target === overlay) setState({ cartOpen: false }); });

  const closeBtn = document.getElementById('sheet-close');
  if (closeBtn) closeBtn.addEventListener('click', () => setState({ cartOpen: false }));

  root.querySelectorAll('[data-inc]').forEach((b) => {
    b.addEventListener('click', () => changeQty(decodeURIComponent(b.dataset.inc), 1));
  });

  root.querySelectorAll('[data-dec]').forEach((b) => {
    b.addEventListener('click', () => changeQty(decodeURIComponent(b.dataset.dec), -1));
  });

  root.querySelectorAll('[data-note]').forEach((inp) => {
    inp.addEventListener('change', () => setItemNota(decodeURIComponent(inp.dataset.note), inp.value));
  });

  const notesInput = document.getElementById('notes-input');
  if (notesInput) notesInput.addEventListener('change', () => setState({ notes: notesInput.value }));

  const printBtn = document.getElementById('print-receipt');
  if (printBtn) printBtn.addEventListener('click', printReceipt);

  const saveDraftBtn = document.getElementById('save-draft');
  if (saveDraftBtn) saveDraftBtn.addEventListener('click', saveDraft);

  const sendOrderBtn = document.getElementById('send-order');
  if (sendOrderBtn) sendOrderBtn.addEventListener('click', sendOrder);

  const deleteBtn = document.getElementById('delete-order');
  if (deleteBtn) deleteBtn.addEventListener('click', deleteOrder);

  const goPayBtn = document.getElementById('go-pay');
  if (goPayBtn) goPayBtn.addEventListener('click', () => setState({ paying: true }));

  const cancelPayBtn = document.getElementById('cancel-pay');
  if (cancelPayBtn) cancelPayBtn.addEventListener('click', () => setState({ paying: false }));

  const confirmPayBtn = document.getElementById('confirm-pay');
  if (confirmPayBtn) confirmPayBtn.addEventListener('click', closeTable);

  root.querySelectorAll('[data-pay]').forEach((b) => {
    b.addEventListener('click', () => setState({ paymentMethod: b.dataset.pay }));
  });

  const baldazoOverlay = document.getElementById('baldazo-overlay');
  if (baldazoOverlay) {
    baldazoOverlay.addEventListener('click', (e) => {
      if (e.target === baldazoOverlay) setState({ baldazoModalOpen: false, baldazoSelected: [] });
    });
  }

  const baldazoBtns = root.querySelectorAll('[data-beer]');
  baldazoBtns.forEach((btn) => {
    btn.addEventListener('click', () => {
      toggleBaldazoBeer(btn.dataset.beer);
    });
  });

  const baldazoCancel = document.getElementById('baldazo-cancel');
  if (baldazoCancel) baldazoCancel.addEventListener('click', () => setState({ baldazoModalOpen: false, baldazoSelected: [] }));

  const baldazoConfirm = document.getElementById('baldazo-confirm');
  if (baldazoConfirm) baldazoConfirm.addEventListener('click', confirmBaldazo);
}

function render() {
  if (state.screen === 'login') renderLogin();
  else if (state.screen === 'tables') renderTables();
  else if (state.screen === 'order') renderOrder();
}

onSnapshot(collection(db, 'menu'), (snap) => {
  const items = [];
  snap.forEach((doc) => {
    const data = doc.data();
    items.push({
      nombre: data.nombre || '',
      precio: Number(data.precio) || 0,
      categoria: data.categoria || 'Otros',
      subcategoria: data.subcategoria || '',
      disponible: data.disponible !== false,
      imagen: data.imagen || ''
    });
  });
  setState({ menuItems: items, categoryOrder: ['Acompañamientos', 'Platos Fuertes', 'Bebidas'] });
});

onSnapshot(query(collection(db, 'orders'), where('estado', 'in', ['pendiente', 'borrador'])), (snap) => {
  const orders = [];
  snap.forEach((doc) => {
    orders.push({ id: doc.id, ...doc.data() });
  });
  setState({ openOrders: orders });
});

let globalListenersInitialized = false;
function initGlobalListeners() {
  if (globalListenersInitialized) return;
  globalListenersInitialized = true;
  document.addEventListener('input', (e) => {
    if (e.target.id === 'menu-search') setState({ menuSearch: e.target.value });
  });
}

initGlobalListeners();
setState({ screen: state.mesero ? 'tables' : 'login' });
</script>
